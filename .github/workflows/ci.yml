name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target: [msrv, stable]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Select Rust toolchain
        id: rust
        env:
          KRAFT_TOOLCHAIN_TARGET: ${{ matrix.target }}
        run: |
          python3 - <<'PYTHON'
          import os
          import tomllib
          from pathlib import Path
          target = os.environ["KRAFT_TOOLCHAIN_TARGET"]
          if target == "msrv":
              version = tomllib.loads(Path("Cargo.toml").read_text())["package"]["rust-version"]
          else:
              version = "stable"
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"toolchain={version}", file=output)
          PYTHON
      - name: Install Rust
        run: rustup toolchain install "${{ steps.rust.outputs.toolchain }}" --profile minimal --component rustfmt,clippy
      - name: Format
        run: cargo +${{ steps.rust.outputs.toolchain }} fmt --all -- --check
        if: matrix.target == 'stable'
      - name: Lint
        run: cargo +${{ steps.rust.outputs.toolchain }} clippy --locked --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo +${{ steps.rust.outputs.toolchain }} test --locked --all-features
      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo +${{ steps.rust.outputs.toolchain }} doc --locked --no-deps
  docs:
    name: Documentation links
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: python3 scripts/check_docs.py
