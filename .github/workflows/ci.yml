name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target: [pinned, msrv, stable]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Rust toolchain
        id: rust
        env:
          KRAFT_TOOLCHAIN_TARGET: ${{ matrix.target }}
        run: |
          python3 - <<'PYTHON'
          import os
          import tomllib
          from pathlib import Path
          target = os.environ["KRAFT_TOOLCHAIN_TARGET"]
          if target == "pinned":
              version = tomllib.loads(Path("rust-toolchain.toml").read_text())["toolchain"]["channel"]
          elif target == "msrv":
              version = tomllib.loads(Path("Cargo.toml").read_text())["package"]["rust-version"]
          else:
              version = "stable"
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"toolchain={version}", file=output)
          PYTHON
      - name: Install Rust
        run: rustup toolchain install "${{ steps.rust.outputs.toolchain }}" --profile minimal --component rustfmt,clippy
      - name: Format
        run: cargo +${{ steps.rust.outputs.toolchain }} fmt --all -- --check
        if: matrix.target == 'pinned'
      - name: Lint
        run: cargo +${{ steps.rust.outputs.toolchain }} clippy --locked --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo +${{ steps.rust.outputs.toolchain }} test --locked --all-features
      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo +${{ steps.rust.outputs.toolchain }} doc --locked --no-deps
  docs:
    name: Documentation links
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/check_docs.py
